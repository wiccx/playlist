<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050507">
<!-- ✏️ Site name shows in the browser tab -->
<title>After Hours</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500&family=Syncopate:wght@400;700&display=swap">
<link rel="stylesheet" href="theme.css">
</head>
<body>
<canvas id="gl" aria-hidden="true"></canvas>
<div id="pre" aria-hidden="true"><div class="pnum"><span id="pct">0</span><i>%</i></div><div class="pbar"><b id="pfill"></b></div></div>
<div class="wrap">
  <header class="top">
    <!-- ✏️ Your name or site name -->
    <a class="logo" href="#top">MY MUSIC</a>
    <a class="jump" href="#playlist">Playlist ↓</a>
  </header>
  <main id="top">
    <div class="hero" id="hero">
      <!-- ✏️ Headline (keep the two data-text values the same as the words) and intro text -->
      <h1><span class="gl" data-text="AFTER">AFTER</span><span class="gl" data-text="HOURS">HOURS</span></h1>
      <p>A playlist for late drives and bright screens. Press play and turn it up.</p>
    </div>
    <div class="stage">
      <canvas id="viz" role="img" aria-label="Audio visualizer"></canvas>
      <div class="row">
        <button class="ctl" id="prev" aria-label="Previous song"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
        <button class="big" id="main" aria-label="Play"><svg viewBox="0 0 24 24" id="mainIcon"><path d="M6 4l14 8-14 8z"/></svg></button>
        <button class="ctl" id="next" aria-label="Next song"><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5l11 7L4 19z"/></svg></button>
        <div class="info"><strong id="nowTitle">Nothing playing</strong><span id="nowSub">Pick a song below</span></div>
        <label class="vol">VOL <input id="vol" type="range" min="0" max="100" value="80"></label>
      </div>
      <div class="seek"><span id="cur">0:00</span><input id="seek" type="range" min="0" max="1000" value="0" aria-label="Seek"><span id="dur">0:00</span></div>
    </div>
    <section id="playlist">
      <h2>Playlist</h2>
      <p class="status" id="status" role="status">Loading the playlist…</p>
      <ul class="tracks" id="tracks"></ul>
    </section>
  </main>
  <footer>Play it loud.</footer>
</div>
<script src="app.js"></script>
<script src="fx.js"></script>
</body>
</html>
